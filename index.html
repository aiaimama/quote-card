  <script>
//@name risu_excerpt_card_maker_v5
//@name risu_excerpt_card_maker_v5
//@version 1.4.0
//@api 3.0
//@display-name 발췌 카드 만들기 v5
//@link https://github.com/kwaroran/RisuAI/blob/main/plugins.md RisuAI Plugin Guide

(async () => {
  const Risu = globalThis.Risuai || globalThis.risuai;

  if (!Risu) {
    console.log("[Excerpt Card Maker] RisuAI API was not found.");
    return;
  }

  const STORE_KEY = "risu_excerpt_card_maker_v5_state";
  const FONT_URL = "https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap";

  const state = {
    theme: "light",
    font: "font-serif",
    fontBold: false,
    photoMode: false,
    photoDataUrl: "",
    photoImage: null,
    photoOverlay: "blue",
    photoRatio: "portrait",
    resultUrl: "",
    resultBlob: null,
    resultDataUrl: "",
  };

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");
  }

  function escapeRegExp(str) {
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function normalizeExcerptText(str) {
    return String(str).replace(/\.{2,}/g, "...");
  }

  function formatExcerptHtml(str) {
    return escapeHtml(str).replace(/\.\.\./g, '<span class="raised-dots">...</span>');
  }

  function getEl(id) {
    return document.getElementById(id);
  }

  function cardSvgIcon() {
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  }

  function setSaveButtonIdle() {
    const btn = getEl("save-btn");
    if (!btn) return;
    btn.classList.remove("loading");
    btn.innerHTML = `${cardSvgIcon()} 이미지로 만들기`;
  }

  function applyNameReplace(str) {
    let replaced = str;
    document.querySelectorAll(".replace-row").forEach((row) => {
      const from = row.querySelector(".replace-from")?.value.trim();
      const to = row.querySelector(".replace-to")?.value.trim();
      if (!from || !to) return;
      replaced = replaced.replace(new RegExp(escapeRegExp(from), "g"), to);
    });
    return replaced;
  }

  function getReplaceRows() {
    return Array.from(document.querySelectorAll(".replace-row")).map((row) => ({
      from: row.querySelector(".replace-from")?.value || "",
      to: row.querySelector(".replace-to")?.value || "",
    }));
  }

  function defaultReplaceRows() {
    return [
      { from: "", to: "{{char}}" },
      { from: "", to: "{{user}}" },
    ];
  }

  async function saveState() {
    const payload = {
      theme: state.theme,
      font: state.font,
      fontBold: state.fontBold,
      photoMode: state.photoMode,
      photoOverlay: state.photoOverlay,
      photoRatio: state.photoRatio,
      excerpt: getEl("excerpt-input")?.value || "",
      title: getEl("title-input")?.value || "",
      publisher: getEl("publisher-input")?.value || "",
      replacements: getReplaceRows(),
    };

    try {
      await Risu.pluginStorage?.setItem(STORE_KEY, JSON.stringify(payload));
    } catch (error) {
      console.log(`[Excerpt Card Maker] Save state skipped: ${error.message}`);
    }
  }

  async function loadState() {
    try {
      const raw = await Risu.pluginStorage?.getItem(STORE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (error) {
      console.log(`[Excerpt Card Maker] Load state skipped: ${error.message}`);
      return null;
    }
  }

  function updateCount() {
    const count = getEl("excerpt-input")?.value.length || 0;
    const target = getEl("char-count");
    if (target) target.textContent = String(count);
  }

  function setPhotoMode(enabled) {
    state.photoMode = Boolean(enabled);
    const toggle = getEl("photo-mode");
    const panel = getEl("photo-options");
    if (toggle) toggle.checked = state.photoMode;
    if (panel) panel.style.display = state.photoMode ? "grid" : "none";
    scheduleSave();
  }

  function setPhotoOverlay(value) {
    state.photoOverlay = value || "blue";
    updateCard();
    void saveState();
  }

  function setPhotoRatio(value) {
    state.photoRatio = value === "square" ? "square" : "portrait";
    updateCard();
    void saveState();
  }

  function setFontBold(enabled) {
    state.fontBold = Boolean(enabled);
    const toggle = getEl("font-bold");
    if (toggle) toggle.checked = state.fontBold;
    updateCard();
    void saveState();
  }

  function clearExcerptText() {
    const textarea = getEl("excerpt-input");
    if (!textarea) return;
    textarea.value = "";
    textarea.focus();
    scheduleSave();
  }

  function clearPhoto() {
    state.photoDataUrl = "";
    state.photoImage = null;
    const fileInput = getEl("photo-input");
    if (fileInput) fileInput.value = "";
    updateCard();
  }

  async function loadPhotoFromFile(file) {
    if (!file) return;
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(new Error("사진 읽기 실패"));
      reader.readAsDataURL(file);
    });

    await setPhotoDataUrl(dataUrl);
  }

  async function setPhotoDataUrl(dataUrl) {
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () => reject(new Error("사진 로드 실패"));
      img.src = dataUrl;
    });
    state.photoDataUrl = dataUrl;
    state.photoImage = img;
    updateCard();
  }

  function updateReplaceRemoveButtons() {
    const rows = document.querySelectorAll(".replace-row");
    rows.forEach((row) => {
      const remove = row.querySelector(".replace-remove");
      if (remove) remove.disabled = rows.length === 1;
    });
  }

  function updateCard() {
    const rawExcerpt = getEl("excerpt-input")?.value || "여기에 발췌 내용이 예쁘게 담길 거야.";
    const excerpt = normalizeExcerptText(applyNameReplace(rawExcerpt));
    const title = getEl("title-input")?.value.trim() || "짧은 로그 (완결)";
    const publisher = getEl("publisher-input")?.value.trim() || "AI채팅먀달글";
    const preview = getEl("card-preview");
    if (!preview) return;

    if (state.photoMode) {
      const bg = state.photoDataUrl
        ? `style="background-image:url('${state.photoDataUrl.replace(/'/g, "%27")}')"`
        : "";
      preview.innerHTML = `
        <div class="photo-card ${state.font} ${state.fontBold ? "font-bold" : ""} ratio-${state.photoRatio} overlay-${state.photoOverlay}" ${bg}>
          <div class="photo-dim"></div>
          <div class="photo-top">
            <span>${escapeHtml(publisher)}</span>
          </div>
          <div class="photo-stack">
            <div class="photo-glass">
              <p class="photo-text">${formatExcerptHtml(excerpt)}</p>
            </div>
            <div class="photo-footer">
              <span class="photo-title">${escapeHtml(title)}</span>
              <span class="photo-publisher">${escapeHtml(publisher)}</span>
            </div>
          </div>
        </div>`;
      return;
    }

    const lineBreaks = (excerpt.match(/\n/g) || []).length;
    const estimatedLength = excerpt.length + lineBreaks * 18;

    let sizeClass = "text-l";
    if (estimatedLength >= 420) sizeClass = "text-xxs";
    else if (estimatedLength >= 260) sizeClass = "text-xs";
    else if (estimatedLength >= 165) sizeClass = "text-s";
    else if (estimatedLength >= 90) sizeClass = "text-m";

    preview.innerHTML = `
      <div class="excerpt-card card-${state.theme} ${state.font} ${state.fontBold ? "font-bold" : ""}">
        <div class="text-wrapper">
          <p class="excerpt-text ${sizeClass}">${formatExcerptHtml(excerpt)}</p>
        </div>
        <div class="card-footer">
          <span class="book-title">${escapeHtml(title)}</span>
          <span class="publisher">${escapeHtml(publisher)}</span>
        </div>
      </div>`;
  }

  function scheduleSave() {
    updateCount();
    updateCard();
    void saveState();
  }

  function setTheme(theme) {
    state.theme = theme;
    document.querySelectorAll("[data-theme]").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.theme === theme);
    });
    scheduleSave();
  }

  function setFont(font) {
    state.font = font;
    document.querySelectorAll("[data-font]").forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.font === font);
    });
    scheduleSave();
  }

  function createReplaceRow(from = "", to = "") {
    const row = document.createElement("div");
    row.className = "replace-row";
    row.innerHTML = `
      <div class="input-wrap">
        <label>원래 이름</label>
        <input class="replace-from" type="text" placeholder="예: 지윤" />
      </div>
      <div class="input-wrap">
        <label>바꿀 이름</label>
        <input class="replace-to" type="text" placeholder="{{char}} 또는 {{user}}" />
      </div>
      <button class="replace-remove" type="button" aria-label="이 치환 줄 삭제">-</button>`;
    row.querySelector(".replace-from").value = from;
    row.querySelector(".replace-to").value = to;
    row.querySelectorAll("input").forEach((input) => input.addEventListener("input", scheduleSave));
    row.querySelector(".replace-remove").addEventListener("click", () => {
      row.remove();
      updateReplaceRemoveButtons();
      scheduleSave();
    });
    return row;
  }

  function addReplaceRow(from = "", to = "", shouldFocus = false) {
    const list = getEl("replace-list");
    if (!list) return;
    const row = createReplaceRow(from, to);
    list.appendChild(row);
    updateReplaceRemoveButtons();
    if (shouldFocus) row.querySelector(".replace-from")?.focus();
  }

  function addReplacePair() {
    addReplaceRow("", "{{char}}", true);
    addReplaceRow("", "{{user}}", false);
  }

  function getCanvasFont(sizePx) {
    const weight = state.fontBold ? "700 " : "";
    if (state.font === "font-serif") return `${weight}${sizePx}px "Noto Serif KR", Batang, "Malgun Gothic", serif`;
    if (state.font === "font-gowun") return `${weight}${sizePx}px "Gowun Dodum", "Malgun Gothic", sans-serif`;
    return `${weight}${sizePx}px "Noto Sans KR", "Malgun Gothic", Arial, sans-serif`;
  }

  function drawCanvasTextLine(ctx, text, x, y, sizePx) {
    const baseFont = getCanvasFont(sizePx);
    let cursor = x;
    const chars = Array.from(String(text));

    for (let i = 0; i < chars.length; i += 1) {
      const isDots = chars[i] === "." && chars[i + 1] === "." && chars[i + 2] === ".";
      const chunk = isDots ? "..." : chars[i];
      ctx.font = baseFont;
      ctx.fillText(chunk, cursor, isDots ? y - Math.max(2, sizePx * 0.12) : y);
      cursor += ctx.measureText(chunk).width;
      if (isDots) {
        i += 2;
      }
    }

    ctx.font = baseFont;
  }

  function getThemePaint(ctx) {
    const themes = {
      light: { fill: "#fffaf2", color: "#4a423a", titleAlpha: 0.62 },
      dark: { fill: "#eef0f4", color: "#48505c", titleAlpha: 0.62 },
      mint: { gradient: ["#effaf5", "#d9f1e8"], color: "#3f6156", titleAlpha: 0.58 },
      lavender: { gradient: ["#fbf7ff", "#ece4fa"], color: "#5c5170", titleAlpha: 0.58 },
      peach: { gradient: ["#fff7f1", "#f8ded2"], color: "#735248", titleAlpha: 0.58 },
      ink: { gradient: ["#f3f8ff", "#dceafd"], color: "#495d78", titleAlpha: 0.58 },
    };
    const theme = themes[state.theme] || themes.light;
    if (!theme.gradient) return { paint: theme.fill, ...theme };
    const gradient = ctx.createLinearGradient(0, 0, 1024, 1024);
    gradient.addColorStop(0, theme.gradient[0]);
    gradient.addColorStop(1, theme.gradient[1]);
    return { paint: gradient, ...theme };
  }

  function getTextSizeClass(excerpt) {
    const lineBreaks = (excerpt.match(/\n/g) || []).length;
    const estimatedLength = excerpt.length + lineBreaks * 18;
    if (estimatedLength >= 420) return { size: 30, lineHeight: 48 };
    if (estimatedLength >= 260) return { size: 33, lineHeight: 55 };
    if (estimatedLength >= 165) return { size: 35, lineHeight: 63 };
    if (estimatedLength >= 90) return { size: 38, lineHeight: 72 };
    return { size: 41, lineHeight: 82 };
  }

  function getPhotoTextStyle(ctx, excerpt, boxWidth, boxHeight, padding) {
    const maxWidth = boxWidth - padding * 2;
    const maxHeight = boxHeight - padding * 2;
    const sizes = state.photoRatio === "square"
      ? [
          { size: 28, lineHeight: 49 },
          { size: 25, lineHeight: 43 },
          { size: 22, lineHeight: 38 },
          { size: 19, lineHeight: 33 },
        ]
      : [
          { size: 36, lineHeight: 66 },
          { size: 32, lineHeight: 58 },
          { size: 28, lineHeight: 50 },
          { size: 24, lineHeight: 43 },
        ];

    for (const style of sizes) {
      ctx.font = getCanvasFont(style.size);
      const lines = wrapText(ctx, excerpt, maxWidth);
      if (lines.length * style.lineHeight <= maxHeight) {
        return { ...style, lines };
      }
    }

    const fallback = sizes[sizes.length - 1];
    ctx.font = getCanvasFont(fallback.size);
    const maxLines = Math.max(1, Math.floor(maxHeight / fallback.lineHeight));
    return {
      ...fallback,
      lines: wrapText(ctx, excerpt, maxWidth).slice(0, maxLines),
    };
  }

  function wrapLine(ctx, text, maxWidth) {
    const words = String(text).match(/\.{3}|[\s\S]/g) || [];
    const lines = [];
    let line = "";

    words.forEach((token) => {
      const test = line + token;
      if (line && ctx.measureText(test).width > maxWidth) {
        lines.push(line);
        line = token.trimStart();
      } else {
        line = test;
      }
    });

    if (line) lines.push(line);
    return lines.length ? lines : [""];
  }

  function wrapText(ctx, text, maxWidth) {
    return String(text)
      .split("\n")
      .flatMap((line) => wrapLine(ctx, line, maxWidth));
  }

  function drawCoverImage(ctx, img, width, height) {
    const scale = Math.max(width / img.naturalWidth, height / img.naturalHeight);
    const drawWidth = img.naturalWidth * scale;
    const drawHeight = img.naturalHeight * scale;
    const x = (width - drawWidth) / 2;
    const y = (height - drawHeight) / 2;
    ctx.drawImage(img, x, y, drawWidth, drawHeight);
  }

  function roundRect(ctx, x, y, width, height, radius) {
    const r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
  }

  function getPhotoOverlayPaint(ctx, width, height) {
    const options = {
      blue: "rgba(56, 83, 105, 0.74)",
      smoke: "rgba(35, 38, 42, 0.62)",
      milk: "rgba(245, 240, 232, 0.72)",
    };
    const fill = options[state.photoOverlay] || options.blue;
    const dim = ctx.createLinearGradient(0, 0, 0, height);
    dim.addColorStop(0, "rgba(0,0,0,0.20)");
    dim.addColorStop(0.55, "rgba(0,0,0,0.05)");
    dim.addColorStop(1, "rgba(0,0,0,0.25)");
    return { fill, dim, text: state.photoOverlay === "milk" ? "#26323b" : "#f4f7fb" };
  }

  async function renderPhotoCardToCanvas() {
    const isSquare = state.photoRatio === "square";
    const canvas = document.createElement("canvas");
    canvas.width = isSquare ? 1024 : 1080;
    canvas.height = isSquare ? 1024 : 1920;
    const ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("Canvas context 생성 실패");

    const rawExcerpt = getEl("excerpt-input")?.value || "여기에 발췌 내용이 예쁘게 담길 거야.";
    const excerpt = normalizeExcerptText(applyNameReplace(rawExcerpt));
    const title = getEl("title-input")?.value.trim() || "짧은 로그 (완결)";
    const publisher = getEl("publisher-input")?.value.trim() || "AI채팅먀달글";
    const paint = getPhotoOverlayPaint(ctx, canvas.width, canvas.height);

    if (state.photoImage) {
      drawCoverImage(ctx, state.photoImage, canvas.width, canvas.height);
    } else {
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, "#d8d3cc");
      gradient.addColorStop(1, "#718699");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    ctx.fillStyle = paint.dim;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const boxX = isSquare ? 58 : 64;
    const boxWidth = canvas.width - boxX * 2;
    const boxHeight = isSquare ? boxWidth : 1240;
    const boxY = isSquare ? 82 : 260;
    roundRect(ctx, boxX, boxY, boxWidth, boxHeight, isSquare ? 24 : 30);
    ctx.fillStyle = paint.fill;
    ctx.fill();

    const padding = isSquare ? 34 : 42;
    const textStyle = getPhotoTextStyle(ctx, excerpt, boxWidth, boxHeight, padding);
    const textHeight = textStyle.lines.length * textStyle.lineHeight;
    ctx.fillStyle = paint.text;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    let y = boxY + Math.max(padding, (boxHeight - textHeight) / 2);
    textStyle.lines.forEach((line) => {
      drawCanvasTextLine(ctx, line, boxX + padding, y, textStyle.size);
      y += textStyle.lineHeight;
    });

    ctx.save();
    ctx.globalAlpha = 0.78;
    ctx.fillStyle = paint.text;
    ctx.font = getCanvasFont(isSquare ? 22 : 28);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    const footerY = Math.min(canvas.height - (isSquare ? 70 : 142), boxY + boxHeight + (isSquare ? 42 : 72));
    ctx.fillText(title, isSquare ? 64 : 72, footerY);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.86;
    ctx.fillStyle = paint.text;
    ctx.font = `700 ${isSquare ? 24 : 32}px "Noto Sans KR", "Malgun Gothic", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(publisher, canvas.width / 2, footerY);
    ctx.restore();

    return canvas;
  }

  async function renderCardToCanvas() {
    if (state.photoMode) return renderPhotoCardToCanvas();

    const canvas = document.createElement("canvas");
    canvas.width = 1024;
    canvas.height = 1024;
    const ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("Canvas context 생성 실패");

    const rawExcerpt = getEl("excerpt-input")?.value || "여기에 발췌 내용이 예쁘게 담길 거야.";
    const excerpt = normalizeExcerptText(applyNameReplace(rawExcerpt));
    const title = getEl("title-input")?.value.trim() || "짧은 로그 (완결)";
    const publisher = getEl("publisher-input")?.value.trim() || "AI채팅먀달글";
    const theme = getThemePaint(ctx);

    ctx.fillStyle = theme.paint;
    ctx.fillRect(0, 0, 1024, 1024);

    const textStyle = getTextSizeClass(excerpt);
    ctx.font = getCanvasFont(textStyle.size);
    ctx.fillStyle = theme.color;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    const maxWidth = 880;
    const lines = wrapText(ctx, excerpt, maxWidth);
    const textHeight = lines.length * textStyle.lineHeight;
    const textAreaTop = 72;
    const textAreaBottom = 845;
    let y = textAreaTop + ((textAreaBottom - textAreaTop) - textHeight) / 2;
    y = Math.max(textAreaTop, y);

    lines.forEach((line) => {
      drawCanvasTextLine(ctx, line, 72, y, textStyle.size);
      y += textStyle.lineHeight;
    });

    ctx.save();
    ctx.globalAlpha = theme.titleAlpha;
    ctx.font = getCanvasFont(24);
    ctx.fillStyle = theme.color;
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(title, 72, 935);
    ctx.restore();

    ctx.font = getCanvasFont(28);
    ctx.fillStyle = theme.color;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText(publisher, 512, 935);

    return canvas;
  }

  async function generateImage() {
    const btn = getEl("save-btn");
    const originalCard = document.querySelector("#card-preview .excerpt-card, #card-preview .photo-card");
    if (!btn || !originalCard) return;

    btn.classList.add("loading");
    btn.textContent = "카드 깎는 중...";

    try {
      if (document.fonts?.ready) await document.fonts.ready;
      const canvas = await renderCardToCanvas();

      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      if (!blob) throw new Error("이미지 변환 실패");

      if (state.resultUrl) URL.revokeObjectURL(state.resultUrl);
      state.resultBlob = blob;
      state.resultUrl = URL.createObjectURL(blob);
      state.resultDataUrl = canvas.toDataURL("image/png");

      const resultImg = getEl("result-img");
      resultImg.src = state.resultDataUrl;
      getEl("result-overlay").style.display = "flex";
    } catch (error) {
      console.log(`[Excerpt Card Maker] Image generation failed: ${error.message}`);
      alert(`앗, 이미지 생성 오류가 났어: ${error.message}`);
    } finally {
      setSaveButtonIdle();
    }
  }

  function closeOverlay() {
    getEl("result-overlay").style.display = "none";
    if (state.resultUrl) {
      URL.revokeObjectURL(state.resultUrl);
      state.resultUrl = "";
      state.resultBlob = null;
      state.resultDataUrl = "";
      getEl("result-img").removeAttribute("src");
    }
  }

  function closePlugin() {
    closeOverlay();
    void Risu.hideContainer?.();
  }

          <div class="section-label">미리보기 (1024x1024 정방형)</div>
          <div class="preview-wrap">
            <div id="card-preview"></div>
            <button class="save-btn" id="save-btn" type="button">${cardSvgIcon()} 이미지로 만들기</button>
          </div>
        </div>
      </div>

      <footer>© AI채팅먀달글</footer>

      <div id="result-overlay">
        <p>카드가 완성됐어!<br>이미지를 꾹 누르거나 우클릭해서 저장해 봐.</p>
        <img id="result-img" alt="생성된 발췌 카드" />
        <div class="overlay-actions">
          <button class="close-btn" type="button" id="close-overlay">닫기</button>
        </div>
      </div>
    `;
  }

  async function hydrateFromStorage() {
    const saved = await loadState();
    if (saved?.theme) state.theme = saved.theme;
    if (saved?.font && saved.font !== "font-ridibatang") state.font = saved.font;
    if (saved?.font === "font-ridibatang") state.font = "font-serif";
    state.fontBold = Boolean(saved?.fontBold);
    state.photoMode = Boolean(saved?.photoMode);
    state.photoOverlay = saved?.photoOverlay || "blue";
    state.photoRatio = saved?.photoRatio === "square" ? "square" : "portrait";

    getEl("excerpt-input").value = saved?.excerpt || "";
    getEl("title-input").value = saved?.title || "";
    getEl("publisher-input").value = saved?.publisher || "";
    getEl("photo-mode").checked = state.photoMode;
    getEl("photo-overlay").value = state.photoOverlay;
    getEl("photo-ratio").value = state.photoRatio;
    getEl("font-bold").checked = state.fontBold;
    getEl("photo-options").style.display = state.photoMode ? "grid" : "none";

    getEl("replace-list").innerHTML = "";
    const savedRows = Array.isArray(saved?.replacements) ? saved.replacements : [];
    const hasMeaningfulRow = savedRows.some((row) => row?.from || row?.to);
    const rows = hasMeaningfulRow ? savedRows : defaultReplaceRows();
    rows.forEach((row) => addReplaceRow(row.from, row.to));

    setTheme(state.theme);
    setFont(state.font);
    updateReplaceRemoveButtons();
    updateCount();
    updateCard();
  }

  async function openPanel() {
    if (!document.querySelector('link[data-excerpt-card-fonts="true"]')) {
      const fontLink = document.createElement("link");
      fontLink.rel = "stylesheet";
      fontLink.href = FONT_URL;
      fontLink.dataset.excerptCardFonts = "true";
      document.head.appendChild(fontLink);
    }

    document.body.innerHTML = "";
    document.getElementById("excerpt-card-maker-styles")?.remove();
    const style = document.createElement("style");
    style.id = "excerpt-card-maker-styles";
    style.textContent = styles();
    document.head.appendChild(style);
    document.body.insertAdjacentHTML("beforeend", markup());

    document.querySelectorAll("[data-theme]").forEach((btn) => {
      btn.addEventListener("click", () => setTheme(btn.dataset.theme));
    });
    document.querySelectorAll("[data-font]").forEach((btn) => {
      btn.addEventListener("click", () => setFont(btn.dataset.font));
    });
    getEl("photo-mode").addEventListener("change", (event) => setPhotoMode(event.target.checked));
    getEl("photo-overlay").addEventListener("change", (event) => setPhotoOverlay(event.target.value));
    getEl("photo-ratio").addEventListener("change", (event) => setPhotoRatio(event.target.value));
    getEl("font-bold").addEventListener("change", (event) => setFontBold(event.target.checked));
    getEl("photo-input").addEventListener("change", async (event) => {
      try {
        await loadPhotoFromFile(event.target.files?.[0]);
      } catch (error) {
        console.log(`[Excerpt Card Maker] Photo load failed: ${error.message}`);
        alert("사진을 불러오지 못했어. 다른 이미지를 골라줘.");
      }
    });
    getEl("clear-photo").addEventListener("click", clearPhoto);
    ["excerpt-input", "title-input", "publisher-input"].forEach((id) => {
      getEl(id).addEventListener("input", scheduleSave);
    });
    getEl("add-replace").addEventListener("click", addReplacePair);
    getEl("clear-excerpt").addEventListener("click", clearExcerptText);
    getEl("save-btn").addEventListener("click", generateImage);
    getEl("close-overlay").addEventListener("click", closeOverlay);
    getEl("close-plugin").addEventListener("click", closePlugin);
    getEl("result-overlay").addEventListener("click", (event) => {
      if (event.target === getEl("result-overlay")) closeOverlay();
    });

    await hydrateFromStorage();
    await Risu.showContainer?.("fullscreen");
  }

  try {
    const pluginIcon = '<span style="font-size:18px;line-height:1;display:inline-grid;place-items:center">💌</span>';
    const registerMenuButton = async (location) => {
      try {
        await Risu.registerButton?.(
          {
            name: "발췌 카드",
            icon: "",
            iconType: "none",
            location,
          },
          openPanel
        );
      } catch (error) {
        console.log(`[Excerpt Card Maker] ${location} menu registration skipped: ${error.message}`);
      }
    };
    await Risu.registerSetting?.("발췌 카드 만들기", openPanel, pluginIcon, "html");
    await registerMenuButton("hamburger");
    await registerMenuButton("chat");
    await Risu.onUnload?.(async () => {
      if (state.resultUrl) URL.revokeObjectURL(state.resultUrl);
      state.resultBlob = null;
      state.resultDataUrl = "";
    });
    console.log("[Excerpt Card Maker] Ready.");
  } catch (error) {
    console.log(`[Excerpt Card Maker] Init failed: ${error.message}`);
  }
})();
  </script>

  <script>
    window.addEventListener('load', () => {
      const open = () => window.__excerptCardOpen && window.__excerptCardOpen();
      const start = document.getElementById('open-maker');
      if (start) start.addEventListener('click', open);
      setTimeout(open, 80);
    });
  </script>
</body>
</html>
