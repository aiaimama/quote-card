<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>발췌 카드 만들기 · AI채팅먀달글</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #f0ebe3;
      --surface: #fff;
      --text: #1a1a1a;
      --sub: #888;
      --accent: #4f80ff;
      --radius: 14px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      color: var(--text);
    }

    header {
      background: #fff;
      padding: 18px 24px 16px;
      border-bottom: 1px solid #ece8e0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1a1a1a;
    }

    header p {
      font-size: 11.5px;
      color: #aaa;
      margin-top: 2px;
      font-weight: 300;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section {
      background: #fff;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.05);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #bbb;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    .opt-btn {
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 12px 8px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      background: #f7f5f2;
    }

    .opt-btn:active { transform: scale(0.97); }
    .opt-btn.active { border-color: var(--accent); background: #f0f4ff; }

    .opt-preview {
      width: 100%;
      height: 48px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .opt-preview.light { background: #ffffff; border: 1px solid #e8e4dc; }
    .opt-preview.dark { background: #232326; color: #b0b0b0; }
    .opt-preview.mint { background: linear-gradient(135deg, #8ddbd1 0%, #62c2b5 100%); color: #fff; }
    .opt-preview.lavender { background: linear-gradient(135deg, #ece8ff 0%, #c8bef7 100%); color: #4a3d75; }
    .opt-preview.peach { background: linear-gradient(135deg, #ffe1d6 0%, #f2a58d 100%); color: #6d3326; }
    .opt-preview.ink { background: linear-gradient(135deg, #1f2a44 0%, #405a7c 100%); color: #e9eef6; }

    .opt-preview.font-serif { font-family: 'Noto Serif KR', serif; background: #fff; border: 1px solid #e8e4dc; color: #333; }
    .opt-preview.font-sans { font-family: 'Noto Sans KR', sans-serif; background: #fff; border: 1px solid #e8e4dc; color: #333; }
    .opt-preview.font-gowun { font-family: 'Gowun Dodum', sans-serif; background: #fff; border: 1px solid #e8e4dc; color: #333; }

    .opt-name { font-size: 11px; font-weight: 500; color: #666; text-align: center; }
    .opt-btn.active .opt-name { color: var(--accent); font-weight: 700; }

    .input-group { display: flex; flex-direction: column; gap: 12px; }
    .input-wrap { display: flex; flex-direction: column; gap: 5px; }
    .input-wrap label { font-size: 11.5px; font-weight: 500; color: #888; }

    textarea,
    input {
      width: 100%;
      border: 1.5px solid #e8e4dc;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fafaf8;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea {
      resize: none;
      min-height: 120px;
      line-height: 1.8;
    }

    textarea:focus,
    input:focus { border-color: var(--accent); background: #fff; }

    .replace-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .replace-row {
      display: grid;
      grid-template-columns: 1fr 1fr 38px;
      gap: 10px;
      align-items: end;
    }

    .replace-remove,
    .replace-add {
      border: none;
      border-radius: 8px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .replace-remove {
      width: 38px;
      height: 43px;
      background: #f2efea;
      color: #aaa;
      font-size: 18px;
    }

    .replace-remove:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .replace-add {
      width: 100%;
      padding: 11px 14px;
      background: #f0f4ff;
      color: var(--accent);
      font-size: 14px;
    }

    .replace-remove:not(:disabled):active,
    .replace-add:active {
      transform: scale(0.98);
    }

    .hint {
      font-size: 10.5px;
      color: #bbb;
      line-height: 1.5;
    }

    .char-count { font-size: 10.5px; color: #ccc; text-align: right; margin-top: -8px; }

    .preview-wrap { display: flex; flex-direction: column; gap: 14px; align-items: center; }
    #card-preview { width: 100%; max-width: 400px; }

    .excerpt-card {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      padding: 30px;
      display: flex;
      flex-direction: column;
    }

    .font-serif { font-family: 'Noto Serif KR', serif; }
    .font-sans { font-family: 'Noto Sans KR', sans-serif; }
    .font-gowun { font-family: 'Gowun Dodum', sans-serif; }

    .text-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
    }

    .excerpt-text {
      width: 100%;
      word-break: keep-all;
    }

    .text-l { font-size: 16px; line-height: 2.0; }
    .text-m { font-size: 14.8px; line-height: 1.9; }
    .text-s { font-size: 13.8px; line-height: 1.78; }
    .text-xs { font-size: 12.8px; line-height: 1.68; }
    .text-xxs { font-size: 11.8px; line-height: 1.6; }

    .card-footer {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-top: 15px;
    }

    .book-title {
      grid-column: 1;
      justify-self: start;
      font-size: 10.5px;
      letter-spacing: 0.05em;
      opacity: 0.75;
      white-space: nowrap;
    }

    .publisher {
      grid-column: 2;
      justify-self: center;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .card-light { background-color: #ffffff; box-shadow: 0 4px 20px rgba(0,0,0,0.06); color: #2b2e38; }
    .card-dark { background-color: #232326; box-shadow: 0 6px 24px rgba(0,0,0,0.2); color: #c4c4c4; }
    .card-mint { background: linear-gradient(135deg, #8ddbd1 0%, #62c2b5 100%); box-shadow: 0 6px 24px rgba(0,0,0,0.12); color: #1a3c34; }
    .card-lavender { background: linear-gradient(135deg, #f5f2ff 0%, #d8cff8 100%); box-shadow: 0 6px 24px rgba(91,75,145,0.12); color: #40365f; }
    .card-peach { background: linear-gradient(135deg, #fff0ea 0%, #f2b09c 100%); box-shadow: 0 6px 24px rgba(150,74,52,0.12); color: #593126; }
    .card-ink { background: linear-gradient(135deg, #1f2a44 0%, #405a7c 100%); box-shadow: 0 6px 24px rgba(20,32,55,0.22); color: #edf2f8; }
    .card-mint .book-title,
    .card-lavender .book-title,
    .card-peach .book-title,
    .card-ink .book-title { opacity: 0.68; }

    .save-btn {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .save-btn:active { transform: scale(0.98); opacity: 0.9; }
    .save-btn.loading { background: #aaa; pointer-events: none; }

    #result-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    #result-overlay p { color: #fff; margin-bottom: 20px; font-size: 15px; font-weight: 600; text-align: center; line-height: 1.4; }
    #result-img { max-width: 100%; max-height: 60vh; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
    .close-btn { margin-top: 24px; padding: 12px 30px; background: #fff; color: #1a1a1a; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 14px; }
    footer { text-align: center; font-size: 11px; color: #ccc; padding: 0 0 24px; font-weight: 300; }

    @media (max-width: 420px) {
      .section { padding: 16px; }
      .replace-row { grid-template-columns: 1fr; }
      .replace-remove { width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>발췌 카드 만들기</h1>
  <p>AI채팅먀달글</p>
</header>

<div class="container">

  <div class="section">
    <div class="section-label">배경 테마</div>
    <div class="grid-3">
      <button class="opt-btn active" data-theme="light" onclick="selectTheme('light', this)">
        <div class="opt-preview light">흰</div>
        <span class="opt-name">심플 라이트</span>
      </button>
      <button class="opt-btn" data-theme="dark" onclick="selectTheme('dark', this)">
        <div class="opt-preview dark">밤</div>
        <span class="opt-name">소프트 다크</span>
      </button>
      <button class="opt-btn" data-theme="mint" onclick="selectTheme('mint', this)">
        <div class="opt-preview mint">민트</div>
        <span class="opt-name">미드나잇 민트</span>
      </button>
      <button class="opt-btn" data-theme="lavender" onclick="selectTheme('lavender', this)">
        <div class="opt-preview lavender">라벤더</div>
        <span class="opt-name">문라이트 라벤더</span>
      </button>
      <button class="opt-btn" data-theme="peach" onclick="selectTheme('peach', this)">
        <div class="opt-preview peach">피치</div>
        <span class="opt-name">웜 피치</span>
      </button>
      <button class="opt-btn" data-theme="ink" onclick="selectTheme('ink', this)">
        <div class="opt-preview ink">잉크</div>
        <span class="opt-name">잉크 블루</span>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">폰트 선택</div>
    <div class="grid-3">
      <button class="opt-btn font-btn active" onclick="selectFont('font-serif', this)">
        <div class="opt-preview font-serif">가</div>
        <span class="opt-name">명조</span>
      </button>
      <button class="opt-btn font-btn" onclick="selectFont('font-sans', this)">
        <div class="opt-preview font-sans">가</div>
        <span class="opt-name">고딕</span>
      </button>
      <button class="opt-btn font-btn" onclick="selectFont('font-gowun', this)">
        <div class="opt-preview font-gowun">가</div>
        <span class="opt-name">고운돋움</span>
      </button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">내용 입력</div>
    <div class="input-group">
      <div class="input-wrap">
        <label>발췌 내용 *</label>
        <textarea id="excerpt-input" placeholder="마음에 드는 문장을 입력해 봐." maxlength="300" oninput="updateCard(); updateCount()"></textarea>
        <div class="char-count"><span id="char-count">0</span> / 300</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">이름 치환</div>
    <div class="input-group">
      <div class="replace-list" id="replace-list">
        <div class="replace-row">
          <div class="input-wrap">
            <label>원래 이름</label>
            <input class="replace-from" type="text" placeholder="예: 민수" oninput="updateCard()" />
          </div>
          <div class="input-wrap">
            <label>바꿀 이름</label>
            <input class="replace-to" type="text" placeholder="예: 그 사람" oninput="updateCard()" />
          </div>
          <button class="replace-remove" type="button" onclick="removeReplaceRow(this)" disabled aria-label="이 치환 줄 삭제">-</button>
        </div>
      </div>
      <button class="replace-add" type="button" onclick="addReplaceRow()">+ 이름 치환 추가</button>
      <p class="hint">발췌 내용에 들어간 이름만 미리보기와 이미지에서 바뀌어 보여.</p>
    </div>
  </div>

  <div class="section">
    <div class="section-label">미리보기 (1024x1024 정방형)</div>
    <div class="preview-wrap">
      <div id="card-preview"></div>
      <button class="save-btn" id="save-btn" onclick="generateImage()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        이미지로 만들기
      </button>
    </div>
  </div>

</div>

<footer>© AI채팅먀달글</footer>

<div id="result-overlay">
  <p>카드가 완성됐어!<br>아래 이미지를 꾹 눌러서 사진 앱에 저장해 봐.</p>
  <img id="result-img" alt="생성된 발췌 카드" />
  <button class="close-btn" onclick="closeOverlay()">닫기</button>
</div>

<script>
  let currentTheme = 'light';
  let currentFont = 'font-serif';

  function selectTheme(theme, el) {
    currentTheme = theme;
    document.querySelectorAll('[data-theme]').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    updateCard();
  }

  function selectFont(fontClass, el) {
    currentFont = fontClass;
    document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    updateCard();
  }

  function updateCount() {
    const val = document.getElementById('excerpt-input').value.length;
    document.getElementById('char-count').textContent = val;
  }

  function updateCard() {
    const rawExcerpt = document.getElementById('excerpt-input').value || '여기에 발췌 내용이 예쁘게 담길 거야.';
    const excerpt = normalizeExcerptText(applyNameReplace(rawExcerpt));
    const preview = document.getElementById('card-preview');
    const themeClass = 'card-' + currentTheme;

    const lineBreaks = (excerpt.match(/\n/g) || []).length;
    const estimatedLength = excerpt.length + (lineBreaks * 18);

    let sizeClass = 'text-l';
    if (estimatedLength >= 420) sizeClass = 'text-xxs';
    else if (estimatedLength >= 260) sizeClass = 'text-xs';
    else if (estimatedLength >= 165) sizeClass = 'text-s';
    else if (estimatedLength >= 90) sizeClass = 'text-m';

    preview.innerHTML = `
      <div class="excerpt-card ${themeClass} ${currentFont}">
        <div class="text-wrapper">
          <p class="excerpt-text ${sizeClass}">${escHtml(excerpt)}</p>
        </div>
        <div class="card-footer">
          <span class="book-title">짧은 로그 (완결)</span>
          <span class="publisher">AI채팅먀달글</span>
        </div>
      </div>`;
  }

  function applyNameReplace(str) {
    let replaced = str;
    document.querySelectorAll('.replace-row').forEach(row => {
      const from = row.querySelector('.replace-from').value.trim();
      const to = row.querySelector('.replace-to').value.trim();
      if (!from || !to) return;
      replaced = replaced.replace(new RegExp(escapeRegExp(from), 'g'), to);
    });
    return replaced;
  }

  function normalizeExcerptText(str) {
    return str.replace(/(^|[^.])\.\.(?!\.)/g, '$1...');
  }

  function addReplaceRow() {
    const list = document.getElementById('replace-list');
    const row = document.createElement('div');
    row.className = 'replace-row';
    row.innerHTML = `
      <div class="input-wrap">
        <label>원래 이름</label>
        <input class="replace-from" type="text" placeholder="예: 지윤" oninput="updateCard()" />
      </div>
      <div class="input-wrap">
        <label>바꿀 이름</label>
        <input class="replace-to" type="text" placeholder="예: 나" oninput="updateCard()" />
      </div>
      <button class="replace-remove" type="button" onclick="removeReplaceRow(this)" aria-label="이 치환 줄 삭제">-</button>`;
    list.appendChild(row);
    updateReplaceRemoveButtons();
    row.querySelector('.replace-from').focus();
  }

  function removeReplaceRow(btn) {
    btn.closest('.replace-row').remove();
    updateReplaceRemoveButtons();
    updateCard();
  }

  function updateReplaceRemoveButtons() {
    const rows = document.querySelectorAll('.replace-row');
    rows.forEach(row => {
      row.querySelector('.replace-remove').disabled = rows.length === 1;
    });
  }

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  async function generateImage() {
    const btn = document.getElementById('save-btn');
    const originalCard = document.querySelector('#card-preview .excerpt-card');
    if (!originalCard) return;

    btn.classList.add('loading');
    btn.textContent = '카드 깎는 중...';

    const clone = originalCard.cloneNode(true);

    Object.assign(clone.style, {
      width: '1024px',
      height: '1024px',
      position: 'absolute',
      top: '-9999px',
      left: '-9999px',
      borderRadius: '0',
      padding: '72px',
      boxSizing: 'border-box'
    });

    const textEl = clone.querySelector('.excerpt-text');
    if (textEl.classList.contains('text-l')) { textEl.style.fontSize = '46px'; textEl.style.lineHeight = '2.0'; }
    else if (textEl.classList.contains('text-m')) { textEl.style.fontSize = '41px'; textEl.style.lineHeight = '1.9'; }
    else if (textEl.classList.contains('text-s')) { textEl.style.fontSize = '37px'; textEl.style.lineHeight = '1.78'; }
    else if (textEl.classList.contains('text-xs')) { textEl.style.fontSize = '34px'; textEl.style.lineHeight = '1.68'; }
    else if (textEl.classList.contains('text-xxs')) { textEl.style.fontSize = '31px'; textEl.style.lineHeight = '1.6'; }

    clone.querySelector('.book-title').style.fontSize = '24px';
    clone.querySelector('.publisher').style.fontSize = '28px';
    clone.querySelector('.card-footer').style.paddingTop = '40px';

    document.body.appendChild(clone);

    try {
      const canvas = await html2canvas(clone, {
        scale: 1,
        useCORS: true,
        backgroundColor: null,
        logging: false,
      });

      document.getElementById('result-img').src = canvas.toDataURL('image/png', 1.0);
      document.getElementById('result-overlay').style.display = 'flex';
    } catch(e) {
      alert('앗, 오류가 났어. 인터넷 창을 새로고침해서 다시 시도해 줘!');
    } finally {
      document.body.removeChild(clone);
      btn.classList.remove('loading');
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 이미지로 만들기`;
    }
  }

  function closeOverlay() {
    document.getElementById('result-overlay').style.display = 'none';
  }

  updateCard();
</script>
</body>
</html>
